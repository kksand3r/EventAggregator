version: '3.8'

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
    container_name: event_aggregator_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    command: >
      bash -c "
        bin/elasticsearch-plugin list | grep -q analysis-ukrainian ||
        bin/elasticsearch-plugin install analysis-ukrainian &&
        /bin/tini -- /usr/local/bin/docker-entrypoint.sh eswrapper
      "
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - event_network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -s http://localhost:9200 | grep -q 'You Know, for Search'" ]
      interval: 10s
      timeout: 5s
      retries: 5

  event-mcp-bridge:
    build:
      context: ./event-mcp-bridge
    container_name: event_mcp_bridge
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=gemini-flash-lite-latest
      - ELASTICSEARCH_COMPATIBLE_WITH=8
      - ELASTIC_CLIENT_APIVERSIONCHECKING=false
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - PORT=5001
    ports:
      - "5001:5001"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - event_network
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: EventAggregator.Api/Dockerfile
    container_name: event_aggregator_api
    ports:
      - "5194:8080"
    environment:
      - Elasticsearch__Url=http://elasticsearch:9200
      - ASPNETCORE_ENVIRONMENT=Production
      - Gemini__ApiKey=${GEMINI_API_KEY}
      - McpBridgeUrl=http://event-mcp-bridge:5001
    depends_on:
      elasticsearch:
        condition: service_healthy
      event-mcp-bridge:
        condition: service_started
    networks:
      - event_network
    restart: unless-stopped

  collector:
    build:
      context: .
      dockerfile: EventAggregator.Collector/Dockerfile
    container_name: event_aggregator_collector
    environment:
      - Elasticsearch__Url=http://elasticsearch:9200
      - Gemini__ApiKey=${GEMINI_API_KEY:-""}
    depends_on:
      elasticsearch:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - event_network

volumes:
  es_data:
    driver: local

networks:
  event_network:
    driver: bridge