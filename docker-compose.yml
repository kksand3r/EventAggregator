version: '3.8'

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: event_aggregator_search
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  api:
    build:
      context: .
      dockerfile: EventAggregator.Api/Dockerfile
    container_name: event_aggregator_api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Elasticsearch__Url=http://elasticsearch:9200
      - Gemini__ApiKey=${GEMINI_API_KEY:-""}
    depends_on:
      - elasticsearch

  collector:
    build:
      context: .
      dockerfile: EventAggregator.Collector/Dockerfile
    container_name: event_aggregator_collector
    environment:
      - Elasticsearch__Url=http://elasticsearch:9200
      - Gemini__ApiKey=${GEMINI_API_KEY:-""}
    depends_on:
      - elasticsearch

volumes:
  es_data: